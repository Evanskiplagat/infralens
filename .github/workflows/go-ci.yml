name: go-ci

on:
  push:
    branches: ["main"]
    paths-ignore: ["frontend/**"]
  pull_request:
    paths-ignore: ["frontend/**"]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
