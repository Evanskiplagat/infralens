name: frontend-ci

# frontend/ is deprecated (see frontend/README.md) and no longer the
# product surface; this workflow only runs when it actually changes.
on:
  push:
    branches: ["main"]
    paths: ["frontend/**"]
  pull_request:
    paths: ["frontend/**"]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
